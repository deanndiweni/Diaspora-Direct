<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Return to Diaspora Direct</title>
<style>body{font-family:'Work Sans',-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;color:#26301F;background:#EAE3D2;padding:60px 20px}.card{background:#fff;max-width:460px;margin:auto;padding:30px;border-radius:16px}.button{display:inline-block;background:#385a39;color:#fff;text-decoration:none;padding:13px 20px;border-radius:9px;font-weight:700}</style>
</head>
<body>
<main class="card">
<h1>Return to Diaspora Direct</h1>
<p>Your payment provider has finished. Return to the app to confirm the result.</p>
<p><a class="button" id="return-link" href="diasporadirect://checkout">Open Diaspora Direct</a></p>
<p>If the app does not open, make sure it is installed and tap the button again.</p>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const deepLink = "diasporadirect://checkout?" + params.toString();
document.getElementById("return-link").href = deepLink;
window.setTimeout(() => { window.location.href = deepLink; }, 350);
</script>
</body>
</html>
