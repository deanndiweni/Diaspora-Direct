name: iOS Release Build

# Builds a signed release IPA for the App Store and uploads it to App Store Connect / TestFlight.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   IOS_DISTRIBUTION_CERTIFICATE_P12   base64-encoded contents of the Apple Distribution .p12
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD  the .p12's password
#   IOS_PROVISIONING_PROFILE           base64-encoded contents of the .mobileprovision
#   APP_STORE_CONNECT_KEY_ID           App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID        App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY          base64-encoded contents of the AuthKey_<KEYID>.p8
#
# See RELEASE.md for how to generate the certificate/profile and add these secrets.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-release.yml"

jobs:
  build:
    name: Build signed IPA
    runs-on: macos-15
    env:
      TEAM_ID: 995YDK35A2
      PROFILE_NAME: "Diaspora Direct App Store"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Create shared Xcode scheme
        run: |
          mkdir -p ios/App/App.xcodeproj/xcshareddata/xcschemes
          cat > ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion="1540"
             version="1.7">
             <BuildAction
                parallelizeBuildables="YES"
                buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting="YES"
                      buildForRunning="YES"
                      buildForProfiling="YES"
                      buildForArchiving="YES"
                      buildForAnalyzing="YES">
                      <BuildableReference
                         BuildableIdentifier="primary"
                         BlueprintIdentifier="504EC3031FED79650016851F"
                         BuildableName="App.app"
                         BlueprintName="App"
                         ReferencedContainer="container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction
                buildConfiguration="Debug"
                selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB"
                shouldUseLaunchSchemeArgsEnv="YES">
             </TestAction>
             <LaunchAction
                buildConfiguration="Debug"
                selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB"
                selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB"
                launchStyle="0"
                useCustomWorkingDirectory="NO"
                ignoresPersistentStateOnLaunch="NO"
                debugDocumentVersioning="YES"
                debugServiceExtension="internal"
                allowLocationSimulation="YES">
                <BuildableProductRunnable
                   runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="504EC3031FED79650016851F"
                      BuildableName="App.app"
                      BlueprintName="App"
                      ReferencedContainer="container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration="Release"
                shouldUseLaunchSchemeArgsEnv="YES"
                savedToolIdentifier=""
                useCustomWorkingDirectory="NO"
                debugDocumentVersioning="YES">
                <BuildableProductRunnable
                   runnableDebuggingMode="0">
                   <BuildableReference
                      BuildableIdentifier="primary"
                      BlueprintIdentifier="504EC3031FED79650016851F"
                      BuildableName="App.app"
                      BlueprintName="App"
                      ReferencedContainer="container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration="Debug">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration="Release"
                revealArchiveInOrganizer="YES">
             </ArchiveAction>
          </Scheme>
          EOF

      - name: Decode signing certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p $RUNNER_TEMP/signing
          echo "$CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/signing/distribution.p12
          echo "$PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/signing/profile.mobileprovision

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i $RUNNER_TEMP/signing/profile.mobileprovision > $RUNNER_TEMP/signing/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/signing/profile.plist)
          cp $RUNNER_TEMP/signing/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

      - name: Import certificate into a temporary keychain
        env:
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/signing/distribution.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

      - name: Build archive
        run: |
          VERSION_NAME="${{ github.event.inputs.versionName }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.diasporadirect.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload build to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -n1)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
          rm -rf $RUNNER_TEMP/signing
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
